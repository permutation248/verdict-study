[project]
name = "verdict"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Verdict Team" }
]
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.44",
    "pyfiglet>=1.0",
    "pick>=2.0",
]

[project.scripts]
verdict = "verdict.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
